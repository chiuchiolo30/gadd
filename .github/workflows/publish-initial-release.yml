name: Publish GADD v0.1.0 Initial Release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/publish-initial-release.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Create v0.1.0 release
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "v0.1.0 already exists; nothing to publish."
            exit 0
          fi

          cat > "$RUNNER_TEMP/gadd-release-notes.md" <<'NOTES'
          # GADD v0.1.0 — Initial Release

          The first public release of **GADD — Governed Agent-Driven Development**, an open, governance-first and risk-driven software engineering methodology created by **Sergio Edgardo Chiuchiolo**, an independent **Chiuchiolo Labs** initiative.

          GADD is especially relevant to **sensitive, business-critical and high-consequence software**, where teams need accountable human decisions, bounded AI-agent mandates, project-specific architectural policy, traceable changes and independently verifiable controls.

          ### Included in v0.1.0
          - Manifesto and ten core process requirements (GADD-01–GADD-10).
          - Reference lifecycle and governance contract.
          - Risk-sensitive adoption guidance and an evidence model distinguishing **Documented / Observed / Enforced** controls.
          - Original synthetic implementation examples and an evidence-bounded retrospective of a dual-architecture Pokédex demonstration.
          - Technical comparison with SDD, ADD and ODD.
          - Documentation in English and Spanish; **CC BY 4.0** licensing and citation metadata.

          ### Scope
          GADD proposes a methodology, **not** a product, a certification, a regulatory-compliance guarantee or a requirement to adopt a specific AI provider, IDE, programming language or architecture. Its principles draw on practical experience, while quantitative claims of comparative superiority remain open to further study.

          **Author:** Sergio Edgardo Chiuchiolo
          **Project identity:** Chiuchiolo Labs
          **License:** CC BY 4.0 (original documentation and examples)
          NOTES

          gh release create v0.1.0 \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "GADD v0.1.0 — Initial Release" \
            --notes-file "$RUNNER_TEMP/gadd-release-notes.md" \
            --latest
